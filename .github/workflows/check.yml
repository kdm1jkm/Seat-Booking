name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - uses: gbraad-actions/install-just@main

      - name: Run checks
        run: just check